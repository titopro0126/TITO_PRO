<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Contacto | TITO PRO</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="css/styles.css" rel="stylesheet" />
</head>
<body>

    <nav class="navbar" id="navbar">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <span class="brand-text">J.R-<span class="highlight">Estudio</span></span>
            </a>
            <button class="navbar-toggler" id="navbarToggler">
                <i class="bi bi-list"></i>
            </button>
            <div class="navbar-collapse" id="navbarCollapse">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="projects.html">Proyectos</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contact.html">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="contact">
        <div class="container">
            <div class="contact-card">
                <div class="icon-wrapper">
                    <i class="bi bi-envelope"></i>
                </div>
                <h2>Ponte en <span class="gradient">Contacto</span></h2>
                <p class="subtitle">¡Trabajemos juntos en tu próximo proyecto!</p>
                
                <form id="contactForm" onsubmit="sendMessage(event)">
                    <div class="form-group">
                        <label for="name">Nombre completo</label>
                        <input class="form-control" id="name" type="text" placeholder="Tu nombre" required />
                    </div>
                    <div class="form-group">
                        <label for="email">Correo electrónico</label>
                        <input class="form-control" id="email" type="email" placeholder="tu@email.com" required />
                    </div>
                    <div class="form-group">
                        <label for="phone">Teléfono</label>
                        <input class="form-control" id="phone" type="tel" placeholder="+53 5XXX XXXX" required />
                    </div>
                    <div class="form-group">
                        <label for="message">Mensaje</label>
                        <textarea class="form-control" id="message" placeholder="Cuéntame sobre tu proyecto..." required></textarea>
                    </div>
                    <button type="submit" class="btn-primary">
                        <i class="bi bi-send"></i> Enviar Mensaje
                    </button>
                </form>

                <div class="success-message" id="submitSuccessMessage">
                    <i class="bi bi-check-circle"></i>
                    <p>¡Mensaje enviado con éxito!</p>
                </div>
                <div class="error-message" id="submitErrorMessage">
                    <i class="bi bi-exclamation-circle"></i>
                    <p>Error al enviar. Intenta de nuevo.</p>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="copyright">© 2026 <span>TITO PRO</span> - J.R-Estudio</div>
            <div class="footer-links">
                <a href="#!">Privacidad</a>
                <a href="#!">Términos</a>
                <a href="contact.html">Contacto</a>
            </div>
        </div>
    </footer>

    <script>
        function sendMessage(event) {
            event.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const message = document.getElementById('message').value;

            const chatId = "7064330912";
            const botToken = "7843541708:AAGQP0rXOqhd1Zcp737DzLByREna2HD3VVo";

            const text = '\uD83D\uDCE9 Nuevo mensaje de contacto:\n\n\uD83D\uDC64 Nombre: ' + name + '\n\uD83D\uDCE7 Correo: ' + email + '\n\uD83D\uDCF1 Teléfono: ' + phone + '\n\uD83D\uDCAC Mensaje: ' + message;

            fetch('https://api.telegram.org/bot' + botToken + '/sendMessage', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: text })
            })
            .then(function(response) { return response.json(); })
            .then(function(data) {
                if (data.ok) {
                    document.getElementById('submitSuccessMessage').style.display = 'block';
                    document.getElementById('submitErrorMessage').style.display = 'none';
                    document.getElementById('contactForm').reset();
                    setTimeout(function() {
                        document.getElementById('submitSuccessMessage').style.display = 'none';
                    }, 5000);
                } else {
                    document.getElementById('submitErrorMessage').style.display = 'block';
                }
            })
            .catch(function(error) {
                console.error('Error:', error);
                document.getElementById('submitErrorMessage').style.display = 'block';
            });
        }

        document.getElementById('navbarToggler').addEventListener('click', function() {
            document.getElementById('navbarCollapse').classList.toggle('show');
        });

        window.addEventListener('scroll', function() {
            const navbar = document.getElementById('navbar');
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });

        document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
        document.onkeydown = function(e) {
            if (e.key === "F12" || (e.ctrlKey && (e.key === "u" || e.key === "s" || e.key === "c" || e.key === "i")) || 
                (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "J" || e.key === "C"))) {
                return false;
            }
        };
    </script>
</body>
</html>
